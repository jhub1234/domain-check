name: 自动部署到 CF Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 'dabb9c3912e5ca5a548de5f04abba7'
      PASSWORD: ${{ secrets.PASSWORD }}
      TGID: ${{ secrets.TGID }}
      TGTOKEN: ${{ secrets.TGTOKEN }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
      CF_CRONS: ${{ vars.CF_CRONS || '0 1,13 * * *' }}

    steps:
      - name: ⬇️ 检出仓库
        uses: actions/checkout@v4

      - name: 🛠️ 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔄 替换 wrangler.toml 中的变量
        id: config_setup
        run: |
          [ -n "${CF_KV_ID}" ] || { echo "🔴 错误: 必须设置 'CF_KV_ID' 变量"; exit 1; }  
          sed -i "s#{CF_KV_ID}#${CF_KV_ID}#g" wrangler.toml
          sed -i "s#{CF_CRONS}#${CF_CRONS}#g" wrangler.toml

          WORKER_NAME=$(grep '^name =' wrangler.toml | awk -F '"' '{print $2}')
          [ -n "$WORKER_NAME" ] || { echo "🔴 错误: 未能在 wrangler.toml 中找到 'name' 字段"; exit 1; }

          echo -e "\n🎉 项目配置信息如下:"
          echo "-------------------"
          cat wrangler.toml
          echo "-------------------"
          echo "worker_name=$WORKER_NAME" >> $GITHUB_OUTPUT

      - name: 🚀 执行部署 (直接调用最新版 Wrangler)
        run: |
          npx --yes wrangler deploy \
            --account-id "dabb9c3912e5ca5a548de5f04abba7" \
            --var PASSWORD:"${PASSWORD}" \
            --var TGID:"${TGID}" \
            --var TGTOKEN:"${TGTOKEN}"

      - name: ✨ 输出 Worker 管理后台
        env:
          WORKER_NAME: ${{ steps.config_setup.outputs.worker_name }}
          ACCOUNT_ID: 'dabb9c3912e5ca5a548de5f04abba7'
        run: |
          echo -e "\n✨✨✨ 部署完成 ✨✨✨"
          echo "🌐 点击以下链接可访问项目管理后台"
          echo "https://dash.cloudflare.com/${ACCOUNT_ID}/workers/services/view/${WORKER_NAME}/production/settings"
          echo "🚀 建议: 给项目绑定一个自定义域名"
